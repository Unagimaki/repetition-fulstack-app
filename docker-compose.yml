version: "3.9"

services:
  backend:
    image: repetition-backend:local
    container_name: repetition-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://repetition:repetition@postgres:5432/repetition_app?sslmode=disable"
    ports:
      - "14000:14000"

  postgres:
    image: postgres:16-alpine
    container_name: repetition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repetition_app
      POSTGRES_USER: repetition
      POSTGRES_PASSWORD: repetition
    ports:
      - "55432:5432"
    volumes:
      - repetition-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repetition -d repetition_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repetition-postgres-data:
