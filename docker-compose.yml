version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: repetition-bot:local
    container_name: repetition-bot
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}"
      BACKEND_API_URL: "http://backend:14000"
      BOT_POLL_INTERVAL_MS: "${BOT_POLL_INTERVAL_MS:-60000}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:15173}"

  backend:
    image: repetition-backend:local
    container_name: repetition-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://repetition:repetition@postgres:5432/repetition_app?sslmode=disable"
    ports:
      - "14000:14000"

  postgres:
    image: postgres:16-alpine
    container_name: repetition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repetition_app
      POSTGRES_USER: repetition
      POSTGRES_PASSWORD: repetition
    ports:
      - "55432:5432"
    volumes:
      - repetition-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repetition -d repetition_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repetition-postgres-data:
